<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noita Dashboard</title>

    <!-- Inline SVG favicon: Noita-style "N". No external request, no cache issues. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2314161c'/%3E%3Ctext x='50' y='75' font-family='monospace' font-size='80' font-weight='bold' fill='%23ea580c' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @font-face {
            font-family: 'NoitaPixel';
            src: url('https://noita.wiki.gg/images/0/07/NoitaPixel.ttf') format('truetype');
            font-display: swap;
        }

        :root {
            --bg: #050608;
            --panel: rgba(20, 22, 28, 0.95);
            --border: #2a2e38;
            --accent: #f59e0b;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: 'NoitaPixel', monospace;
            image-rendering: pixelated;
            background-color: var(--bg);
            color: #d1d5db;
            overflow: hidden;
        }

        .panel {
            transition: border-color .2s ease, box-shadow .2s ease;
            border: 1px solid var(--border);
            background-color: var(--panel);
        }
        .panel:hover, .panel:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 15px -3px rgba(245, 158, 11, 0.2);
        }

        .btn-sync {
            background: linear-gradient(180deg, #ea580c 0%, #c2410c 100%);
            border: 1px solid #9a3412;
            transition: background .2s ease, box-shadow .2s ease, transform .1s ease;
        }
        .btn-sync:hover {
            background: linear-gradient(180deg, #f97316 0%, #ea580c 100%);
            box-shadow: 0 0 15px rgba(234, 88, 12, 0.4);
        }
        .btn-sync:active { transform: translateY(1px); }

        input {
            font-family: inherit;
            font-size: 1rem;
        }

        /* --- IFrame Scaling Tricks --- */
        
        /* All Seeing Eye: Scaled up significantly to fit the tall/narrow panel */
        .scaled-eye {
            width: 150%;
            height: 150%;
            transform: scale(0.6666);
            transform-origin: top left;
            border: none;
        }

        /* Telescope: Scaled moderately to give the map more room next to the settings menu */
        .scaled-telescope {
            width: 120%;
            height: 120%;
            transform: scale(0.8333);
            transform-origin: top left;
            border: none;
            background-color: #1e1e1e; /* Matches telescope background */
        }

        /* Wiki: Scaled to force desktop layout */
        .scaled-wiki {
            width: 125%;
            height: 125%;
            transform: scale(0.8);
            transform-origin: top left;
            border: none;
            background-color: #1a1c23; /* Matches wiki.gg dark theme background */
        }

        .iframe-slot iframe {
            border: none;
            opacity: .9;
            transition: opacity .2s ease;
        }
        .iframe-slot iframe:hover { opacity: 1; }

        /* Responsive: stack columns on narrow screens. */
        @media (max-width: 1100px) {
            body { overflow: auto; }
            main { flex-direction: column; height: auto; }
            .panel { width: 100% !important; min-width: 0 !important; }
            .panel > .iframe-slot { min-height: 60vh; }
        }
    </style>
</head>
<body class="h-screen flex flex-col selection:bg-orange-500 selection:text-black">

    <!-- Header -->
    <header class="flex justify-between items-center p-3 h-[100px] shrink-0 bg-[#14161c] border-b border-gray-700 shadow-lg">
        <div class="flex items-end gap-4 bg-black/60 p-2 rounded-sm border border-gray-700 shadow-inner">
            <div>
                <label for="seedInput" class="block mb-1 text-[10px] text-gray-400 uppercase tracking-widest font-bold">World Seed</label>
                <input id="seedInput" type="text" value="15152748" inputmode="numeric" autocomplete="off"
                       class="w-40 bg-black text-orange-500 px-3 py-1.5 rounded-sm border border-gray-700 focus:outline-none focus:border-orange-500 text-lg tracking-wider">
            </div>
            <div>
                <label for="ngInput" class="block mb-1 text-[10px] text-gray-400 uppercase tracking-widest font-bold">NG+ Cycle</label>
                <input id="ngInput" type="number" value="0" min="0" max="28"
                       class="w-20 bg-black text-orange-500 px-3 py-1.5 rounded-sm border border-gray-700 focus:outline-none focus:border-orange-500 text-lg">
            </div>
            <button id="syncBtn" class="btn-sync text-white px-8 py-2 rounded-sm font-bold uppercase tracking-wider text-sm h-[42px]">
                Sync
            </button>
        </div>
    </header>

    <!-- Workspace -->
    <main class="flex flex-1 gap-4 p-4 overflow-hidden max-w-[2200px] mx-auto w-full">

        <!-- Left: Tools -->
        <section class="panel w-[25%] min-w-[320px] rounded-sm flex flex-col overflow-hidden">
            <div class="flex items-center gap-2 p-3 border-b border-gray-700 bg-black/50">
                <span class="w-2 h-2 rounded-full bg-orange-500 shadow-[0_0_8px_#f97316]"></span>
                <h2 class="font-bold text-sm text-gray-300 uppercase tracking-widest">Tools</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-4">
                <div class="bg-black/40 border border-gray-700 p-4 rounded-sm">
                    <h3 class="text-gray-200 text-2xl mb-2">Noitool</h3>
                    <p class="text-xs text-gray-400 mb-3">Copy the current seed and open Noitool.</p>
                    <button id="copyBtn"
                            class="w-full bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-600 text-center text-xs py-2 rounded-sm transition-colors font-bold">
                        Copy &amp; Open
                    </button>
                </div>

                <div class="bg-black/40 border border-purple-900/50 rounded-sm flex-1 flex flex-col overflow-hidden eye-glow">
                    <div class="flex items-center gap-2 p-3 border-b border-purple-900/50 bg-black/60">
                        <span class="w-2 h-2 rounded-full bg-purple-500 shadow-[0_0_8px_#a855f7]"></span>
                        <h3 class="text-purple-200 text-2xl tracking-wide">All Seeing Eye</h3>
                    </div>
                    <div class="flex-1 bg-[#0a0b0e] p-2 min-h-[240px]">
                        <div class="w-full h-full border border-gray-600 rounded-sm overflow-hidden relative bg-black/50 iframe-slot">
                            <iframe src="https://ipeterov.github.io/noita-progress/"
                                    title="Noita progress tracker"
                                    loading="lazy"
                                    class="scaled-eye"></iframe>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Center: Telescope Map -->
        <section class="panel flex-1 rounded-sm flex flex-col overflow-hidden">
            <div class="flex items-center gap-2 p-3 border-b border-gray-700 bg-black/50">
                <span class="w-2 h-2 rounded-full bg-blue-500 shadow-[0_0_8px_#3b82f6]"></span>
                <h2 class="font-bold text-sm text-gray-300 uppercase tracking-widest">Map (Telescope)</h2>
            </div>
            <div class="flex-1 bg-black/80 min-h-[300px] overflow-hidden iframe-slot relative">
                <!-- Applied the scaling class and corrected the container -->
                <iframe id="telescopeFrame"
                        title="Noita telescope map"
                        loading="lazy"
                        src="about:blank"
                        class="scaled-telescope"></iframe>
            </div>
        </section>

        <!-- Right: Wiki -->
        <section class="panel w-[35%] min-w-[400px] rounded-sm flex flex-col overflow-hidden">
            <div class="flex items-center gap-2 p-3 border-b border-gray-700 bg-black/50">
                <span class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_#22c55e]"></span>
                <h2 class="font-bold text-sm text-gray-300 uppercase tracking-widest">Live Wiki</h2>
            </div>
            <div class="flex-1 min-h-[300px] overflow-hidden bg-[#1a1c23] iframe-slot relative">
                <iframe src="https://noita.wiki.gg/"
                        title="Noita wiki"
                        loading="lazy"
                        class="scaled-wiki"></iframe>
            </div>
        </section>

    </main>

    <script>
        (() => {
            'use strict';

            const seedInput = document.getElementById('seedInput');
            const ngInput = document.getElementById('ngInput');
            const telescopeFrame = document.getElementById('telescopeFrame');
            const syncBtn = document.getElementById('syncBtn');
            const copyBtn = document.getElementById('copyBtn');

            const TELESCOPE_BASE = 'https://lymm37.github.io/noita-telescope/';
            const NOITOOL_URL = 'https://noitool.com/';

            let syncTimer = null;
            function scheduleSync(delay = 400) {
                clearTimeout(syncTimer);
                syncTimer = setTimeout(updateDashboard, delay);
            }

            function updateDashboard() {
                const seed = (seedInput.value || '12345').trim();
                const ng = ngInput.value || '0';
                const url = `${TELESCOPE_BASE}?seed=${encodeURIComponent(seed)}&ng=${encodeURIComponent(ng)}`;
                if (telescopeFrame.src !== url) {
                    telescopeFrame.src = url;
                }
            }

            function getNoitoolSeed() {
                const base = parseInt(seedInput.value.trim(), 10);
                const ng = parseInt(ngInput.value, 10);
                if (Number.isNaN(base)) return seedInput.value.trim();
                const cycles = Number.isNaN(ng) ? 0 : ng;
                return String(base + cycles);
            }

            async function copyAndOpenNoitool() {
                const seed = getNoitoolSeed();
                const original = copyBtn.textContent;
                try {
                    await navigator.clipboard.writeText(seed);
                } catch {
                    const ta = document.createElement('textarea');
                    ta.value = seed;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                }
                copyBtn.textContent = `Copied ${seed}!`;
                copyBtn.classList.add('text-green-400');
                window.open(NOITOOL_URL, '_blank', 'noopener');
                setTimeout(() => {
                    copyBtn.textContent = original;
                    copyBtn.classList.remove('text-green-400');
                }, 2000);
            }

            syncBtn.addEventListener('click', updateDashboard);
            copyBtn.addEventListener('click', copyAndOpenNoitool);
            seedInput.addEventListener('input', () => scheduleSync());
            ngInput.addEventListener('input', () => scheduleSync());

            [seedInput, ngInput].forEach(el =>
                el.addEventListener('keydown', e => {
                    if (e.key === 'Enter') { e.preventDefault(); updateDashboard(); }
                })
            );

            updateDashboard();
        })();
    </script>
</body>
</html>
